<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RoK 2026</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#F6F4EE;
    --primary:#234B43;
    --secondary:#4A7C6A;
    --text:#1E293B;
    --success:#2E7D32;
    --warning:#C28A00;
    --pending:#8A8A8A;
    --card:rgba(255,255,255,.78);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    opacity:0;
    transform:translateY(10px);
    transition:opacity .35s ease,transform .35s ease;
}
body.loaded{opacity:1;transform:none;}
body{
    background:var(--bg);
    color:var(--text);
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

.hero{
    text-align:center;
    padding:35px 20px;
}

.hero h1{
    font-size:2.7rem;
    color:var(--primary);
}

.hero p{
    margin-top:10px;
    color:#64748b;
    font-size:1.1rem;
}

.summary{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:20px;

    margin-top:30px;

}

.card{

    background:var(--card);

    backdrop-filter:blur(14px);

    border-radius:20px;

    padding:28px;

    box-shadow:0 10px 30px rgba(0,0,0,.05);

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease;

}

.card:hover{

    transform:translateY(-8px) scale(1.02);

    box-shadow:0 24px 50px rgba(35,75,67,.18);

    background:rgba(255,255,255,.9);

}

.card-value{

    font-size:2.3rem;

    font-weight:700;

}

.card-label{

    margin-top:8px;

    color:#64748b;

}

.progress{
    width:100%;
    height:10px;
    background:#E5E7EB;
    border-radius:999px;
    overflow:hidden;
    margin-top:18px;
}

.progress-fill{
    height:100%;
    width:0%;
    border-radius:999px;
    transition:width 1s cubic-bezier(.22,1,.36,1);;
}

.food-card{
position:relative;
overflow:hidden;
}

.food-card::before{
content:"";
position:absolute;
top:-50px;
right:-50px;
width:180px;
height:180px;
background:rgba(232,75,61,.18);
border-radius:50%;
filter:blur(35px);
pointer-events:none;
}

.decor-card::before{
content:"";
position:absolute;
top:-50px;
right:-50px;
width:180px;
height:180px;
background:rgba(173,138,179,.18);
border-radius:50%;
filter:blur(35px);
pointer-events:none;
}

.programme-card::before{
content:"";
position:absolute;
top:-50px;
right:-50px;
width:180px;
height:180px;
background:rgba(70,130,180,.18);
border-radius:50%;
filter:blur(35px);
pointer-events:none;
}

.misc-card::before{
content:"";
position:absolute;
top:-50px;
right:-50px;
width:180px;
height:180px;
background:rgba(125,128,130,.18);
border-radius:50%;
filter:blur(35px);
pointer-events:none;
}

.food-fill{
    background:#E84B3D;
}

.decor-fill{
    background:#AD8AB3;
}

.programme-fill{
    background:#4682B4;
}

.misc-fill{
    background:#7D8082;
}

.collected{

    color:var(--primary);

}

.expenses{

    color:#C0392B;

}

.balance{

    color:var(--success);

}

.pending{

    color:var(--warning);

}

.food{
    color:#E84B3D;     
}

.decor{
    color:#AD8AB3;     
}

.programme{
    color:#4682B4;     
}

.misc{
    color:#7D8082;     
}

.bottom{

    margin-top:auto;

    text-align:center;

    padding-top:60px;

}

.remaining{

    margin-top:10px;

    font-size:.82rem;

    color:#64748b;

    font-weight:500;

}

.last-updated{

    color:#64748b;

    margin-bottom:18px;

    font-size:.95rem;

}

.footer-logo{
    width:50px;
    opacity:.9;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
}

@media(max-width:768px){

.summary{

grid-template-columns:1fr;

}

.hero h1{

font-size:2rem;

}

.card-value{

font-size:1.9rem;

}

}

</style>

</head>

<body>

<div class="container">

<div class="hero">

<h1>Get Together 2026</h1>

<p>Summary</p>

</div>

<div class="summary">

<div class="card">

<div id="collected" class="card-value collected">₹0</div>

<div class="card-label">

Collected

</div>

</div>

<div class="card">

<div id="expenses" class="card-value expenses">₹0</div>

<div class="card-label">

Expenses

</div>

</div>

<div class="card">

<div id="balance" class="card-value balance">₹0</div>

<div class="card-label">

Balance

</div>

</div>

<div class="card">

<div id="pending" class="card-value pending">₹0</div>

<div class="card-label">

Pending

</div>

</div>

<div class="card food-card">

<div id="food" class="card-value food">₹0 / ₹0</div>

<div class="card-label">
Food Committee
</div>

<div id="foodRemaining" class="remaining"></div>

<div class="progress">
    <div id="foodBar" class="progress-fill food-fill"></div>
</div>

</div> 

<div class="card decor-card">

<div id="decor" class="card-value decor">₹0 / ₹0</div>

<div class="card-label">
Decoration Committee
</div>
<div id="decorRemaining" class="remaining"></div>
<div class="progress">
    <div id="decorBar" class="progress-fill decor-fill"></div>
</div>

</div>

<div class="card programme-card">

<div id="programme" class="card-value programme">₹0 / ₹0</div>

<div class="card-label">
Programme Committee
</div>
<div id="programmeRemaining" class="remaining"></div>

<div class="progress">
    <div id="programmeBar" class="progress-fill programme-fill"></div>
</div>

</div>

<div class="card misc-card">

<div id="misc" class="card-value misc">₹0 / ₹0</div>

<div class="card-label">
Contingency Reserve
</div>
<div id="miscRemaining" class="remaining"></div>
<div class="progress">
    <div id="miscBar" class="progress-fill misc-fill"></div>
</div>

</div>

</div>

<div class="bottom">

<div id="lastUpdated" class="last-updated">

Last updated : --

</div>

<footer>

<img src="logo.png" class="footer-logo">

</footer>

</div>

</div>

<script>

const CONTRIBUTION_URL =
"https://docs.google.com/spreadsheets/d/1qTkwlWyNS2w9KrJizZiJB5hzr17G5uGFt20vMf0p1-8/export?format=csv&gid=0";

const EXPENSE_URL =
"https://docs.google.com/spreadsheets/d/1qTkwlWyNS2w9KrJizZiJB5hzr17G5uGFt20vMf0p1-8/export?format=csv&gid=1425930218";

const FOOD_BUDGET = 14500;
const DECOR_BUDGET = 9500;
const PROGRAMME_BUDGET = 1000;
const MISC_BUDGET = 3000;

async function loadData(){

if(
CONTRIBUTION_URL.includes("PASTE") ||
EXPENSE_URL.includes("PASTE")
){
updateTime();
return;
}

const [c,e] = await Promise.all([
fetch(CONTRIBUTION_URL + "&t=" + Date.now()),
fetch(EXPENSE_URL + "&t=" + Date.now())
]);

const contributionCSV =
await c.text();

const expenseCSV =
await e.text();

const contributionRows =
contributionCSV
.trim()
.split(/\r?\n/)
.slice(1)
.filter(r=>r.trim()!="");

const expenseRows =
expenseCSV
.trim()
.split(/\r?\n/)
.slice(1)
.filter(r=>r.trim()!="");

let collected = 0;
let expected = 0;

contributionRows.forEach(row=>{

const cols = row.split(",");

expected += Number(cols[2]) || 0;

collected += Number(cols[3]) || 0;

});

let expenses = 0;

let foodSpent = 0;
let decorSpent = 0;
let programmeSpent = 0;
let miscSpent = 0;

expenseRows.forEach(row=>{

    const cols = row.split(",");

    const amount = Number(cols[1]) || 0;

    const committee = (cols[2] || "").toLowerCase();

    expenses += amount;

    if(committee.includes("food"))
        foodSpent += amount;

    else if(
        committee.includes("decor")
    )
        decorSpent += amount;

    else if(
        committee.includes("programme") ||
        committee.includes("program")
    )
        programmeSpent += amount;

    else
        miscSpent += amount;

});

const balance =

collected - expenses;

const pending =

expected - collected;

document.getElementById("collected").textContent =
"₹" + collected.toLocaleString();

document.getElementById("expenses").textContent =
"₹" + expenses.toLocaleString();

document.getElementById("balance").textContent =
"₹" + balance.toLocaleString();

document.getElementById("pending").textContent =
"₹" + pending.toLocaleString();

document.getElementById("food").textContent =
`₹${foodSpent.toLocaleString()} of ₹${FOOD_BUDGET.toLocaleString()}`;

document.getElementById("decor").textContent =
`₹${decorSpent.toLocaleString()} of ₹${DECOR_BUDGET.toLocaleString()}`;

document.getElementById("programme").textContent =
`₹${programmeSpent.toLocaleString()} of ₹${PROGRAMME_BUDGET.toLocaleString()}`;

document.getElementById("misc").textContent =
`₹${miscSpent.toLocaleString()} of ₹${MISC_BUDGET.toLocaleString()}`;

document.getElementById("foodRemaining").textContent =
`Remaining ₹${(FOOD_BUDGET-foodSpent).toLocaleString()}`;

document.getElementById("decorRemaining").textContent =
`Remaining ₹${(DECOR_BUDGET-decorSpent).toLocaleString()}`;

document.getElementById("programmeRemaining").textContent =
`Remaining ₹${(PROGRAMME_BUDGET-programmeSpent).toLocaleString()}`;

document.getElementById("miscRemaining").textContent =
`Remaining ₹${(MISC_BUDGET-miscSpent).toLocaleString()}`;

setTimeout(()=>{
document.getElementById("foodBar").style.width =
Math.min(foodSpent/FOOD_BUDGET*100,100) + "%";
},150);

setTimeout(()=>{
document.getElementById("decorBar").style.width =
Math.min(decorSpent/DECOR_BUDGET*100,100) + "%";
},150);

setTimeout(()=>{
document.getElementById("programmeBar").style.width =
Math.min(programmeSpent/PROGRAMME_BUDGET*100,100) + "%";
},150);

setTimeout(()=>{
document.getElementById("miscBar").style.width =
Math.min(miscSpent/MISC_BUDGET*100,100) + "%";
},150);

updateTime();

}

let lastRefresh = Date.now();

function updateTime(){

    lastRefresh = Date.now();

}

function updateElapsed(){

    const sec = Math.floor((Date.now()-lastRefresh)/1000);

    document.getElementById("lastUpdated").textContent =
    `Updated ${sec} second${sec!==1?'s':''} ago`;

}

loadData();

setInterval(loadData,60000);
setInterval(updateElapsed,1000);
window.addEventListener("load",()=>document.body.classList.add("loaded"));

</script>

</body>
</html>
